<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clean</title>
<style>
  body { margin: 0; font: 16px/1.4 Arial, sans-serif; }
  header { display: flex; gap: 16px; align-items: center; padding: 12px 24px; background: #eef; }
  main { display: grid; grid-template-columns: 1fr 2fr; gap: 24px; padding: 24px; }
  button { padding: 6px 12px; }
  .panel { border: 1px solid #ccc; padding: 12px; min-width: 0; }
</style>
</head>
<body>
<header data-testid="top-bar">
  <h1 style="margin:0;font-size:20px">Hero room</h1>
  <a href="#back" data-testid="back">Back</a>
</header>
<main>
  <section class="panel" data-testid="hero-sheet">
    <h2 style="margin-top:0">Ada</h2>
    <p>Strength 12, morale high.</p>
  </section>
  <section class="panel" data-testid="gear-list">
    <ul>
      <li>Belt: Simple Belt</li>
      <li>Helmet: Iron Cap</li>
    </ul>
    <button data-testid="change">Change</button>
    <div data-testid="carousel" style="overflow-x:auto;white-space:nowrap;margin-top:8px">
      <span style="display:inline-block;width:600px">Slot one</span><span style="display:inline-block;width:600px">Slot two</span><span style="display:inline-block;width:600px">Slot three</span>
    </div>
  </section>
</main>
<script>document.querySelector('[data-testid="hero-sheet"] p').textContent = "Strength 12, morale high." + (Math.random() > 2 ? "!" : "");</script>
</body>
</html>
