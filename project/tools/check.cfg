; App Director check settings · project-owned: onboarding fills it in; edit freely.
; Paths are relative to the repository root. Lists are space-separated. Comments on their own lines.

[project]
; Stack: typescript | flutter | python | none
stack = {{STACK}}

[ui]
; Space-separated list of UI-layer folders (screens, pages, components).
; The check fails when files here import from [data] dirs.
dirs = {{UI_DIRS}}

[data]
; Space-separated list of data-layer folders (api, repositories, storage).
dirs = {{DATA_DIRS}}

[scan]
; Folders to skip in all checks. Space-separated.
skip = node_modules dist build .dart_tool __pycache__ .venv

[gitleaks]
; Minimum gitleaks version required by the secrets check and the pre-commit hook.
; Raise this after testing with a newer version if newer rules are needed.
min-version = 8.18.0

[tests]
; The check has a full tier (bash tools/check.sh: every step over the whole project) and a fast tier (--fast: what the
; change needs, for a build and a commit). .app-director/rules.md › Running the check says where each runs.
; Seconds the stack check and tools/check.local.sh may each run in the fast tier, and in the full tier (GNU timeout
; needed; CHECK_TIMEOUT overrides both). A run past its limit exits 3 and says how to go on. The defaults are 300 and 3600.
timeout-fast = 300
timeout-full = 3600
; The tests the fast tier runs (TypeScript): related (the tests related to the changed files), all or none. The default is related.
fast = related
; Commits since the last full pass after which a commit runs the full tier; 0 = never by count. The default is 10.
full-every = 10
; Paths whose change makes a commit run the full tier, besides the dependencies, toolchain settings and tools/ that always
; do. They count like source files: the cache never reuses a pass across a change to one, and a commit that stages only
; these starts the check. Bash patterns from the repository root; one that ends in / is a folder. Empty by default; for
; example db/migrations/
full-when =
; Rules <changed path>:<test> (TypeScript): a matching change runs that test in the fast tier, instead of every test related
; to it. For example src/i18n/*.json:tests/i18n.test.tsx runs the translation test for a wording change. Empty by default.
fast-map =
; Paths that can't change a result (marketing pages, public assets), as patterns like full-when's: the cache and the fast
; tier leave them out, and a commit that stages only these starts no check (the staged secrets scan still runs).
; Empty by default; for example marketing/ public/
ignore =
; Test workers (vitest's --maxWorkers), a whole number. Empty by default: the project's vitest config decides.
workers =
; tools/check.local.sh gets CHECK_TIER (fast or full) and, in the fast tier, CHECK_CHANGED (a file listing the changed
; paths, one per line), so it can leave its own slow steps, such as a production build, to the full tier. Where neither
; it nor the stack check reads CHECK_TIER (the python, flutter and none stacks don't), --fast runs as the full tier,
; and that one pass stands for a commit and a push alike.

[security]
; Built items (commits ending in (T<n>) or (B<n>)) after which /next-task proposes a security assessment
; (.app-director/procedures/security.md). A whole number of 1 or more; the default is 10.
every = 10

[records]
; Which bugs the assistant may file as todo without the human's approval (.app-director/rules.md › Doing the work).
; cited: a bug whose Brief: names the heading that states the behaviour, or whose Stories: names a confirmed story;
; any other bug is proposed. all: every bug it files is todo. none: every bug it files is proposed. The default is cited.
bugs = cited
; The record files the commit gate guards (tools/records.sh, run by the pre-commit hook): a commit that changes their
; protected lines needs an approval of the human's that covers exactly those lines. A change to [records] or [approval]
; needs one too. Each path defaults to the value shown.
brief = product/brief.md
decisions = product/decisions.md
stories = product/user-stories.md
tasks = TASKS.md

[approval]
; The words that approve a summary (tools/records.sh approve), comma-separated, each matched whole in any case. The
; default is the list shown.
words = godkänt, godkänd, approve, approved, ok, ja, yes, kör

[stories]
; Built items (commits ending in (T<n>) or (B<n>)) after which /next-task proposes validating the user stories
; in product/user-stories.md (.app-director/procedures/design.md › Validate the stories). A whole number of 1 or more; the default is 10.
every = 10
