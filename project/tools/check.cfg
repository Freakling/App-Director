; App Director check settings · project-owned: onboarding fills it in; edit freely.
; Paths are relative to the repository root. Lists are space-separated. Comments on their own lines.

[project]
; Stack: typescript | flutter | python | none
stack = {{STACK}}

[ui]
; Space-separated list of UI-layer folders (screens, pages, components).
; The check fails when files here import from [data] dirs.
dirs = {{UI_DIRS}}

[data]
; Space-separated list of data-layer folders (api, repositories, storage).
dirs = {{DATA_DIRS}}

[scan]
; Folders to skip in all checks. Space-separated.
skip = node_modules dist build .dart_tool __pycache__ .venv

[gitleaks]
; Minimum gitleaks version required by the secrets check and the pre-commit hook.
; Raise this after testing with a newer version if newer rules are needed.
min-version = 8.18.0

[tests]
; Seconds the stack check and tools/check.local.sh may each run (GNU timeout needed; CHECK_TIMEOUT overrides).
; A run past the limit exits 3 with a message. Keep it under five minutes if you can; the default is 600.
timeout = 600

[security]
; Built items (commits ending in (T<n>) or (B<n>)) after which /next-task proposes a security assessment
; (.app-director/procedures/security.md). A whole number of 1 or more; the default is 10.
every = 10

[stories]
; Built items (commits ending in (T<n>) or (B<n>)) after which /next-task proposes validating the user stories
; in product/user-stories.md (.app-director/procedures/design.md › Validate the stories). A whole number of 1 or more; the default is 10.
every = 10
